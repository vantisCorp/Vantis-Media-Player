<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <!-- Vantis Media Player - Social Preview (Open Graph) -->
  <defs>
    <linearGradient id="socialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25c2a0"/>
      <stop offset="50%" style="stop-color:#32d8b4"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <linearGradient id="socialBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0f"/>
      <stop offset="50%" style="stop-color:#1a1a1d"/>
      <stop offset="100%" style="stop-color:#0d0d0f"/>
    </linearGradient>
    <filter id="socialGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="socialGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#25c2a0" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#socialBgGradient)"/>
  
  <!-- Grid Overlay -->
  <rect width="1280" height="640" fill="url(#socialGrid)"/>
  
  <!-- Gradient Orbs -->
  <circle cx="200" cy="200" r="300" fill="#25c2a0" opacity="0.05"/>
  <circle cx="1100" cy="450" r="250" fill="#00d4ff" opacity="0.05"/>
  
  <!-- Center Content -->
  <g transform="translate(640, 320)">
    <!-- Logo Circle -->
    <circle cx="0" cy="-80" r="120" fill="#0d0d0f" stroke="url(#socialGradient)" stroke-width="6"/>
    <polygon points="-50,-160 -50,0 70,-80" fill="url(#socialGradient)" filter="url(#socialGlow)"/>
    
    <!-- Title -->
    <text x="0" y="100" font-family="Inter, SF Pro Display, -apple-system, sans-serif" font-size="64" font-weight="800" fill="url(#socialGradient)" text-anchor="middle">Vantis Media Player</text>
    
    <!-- Tagline -->
    <text x="0" y="160" font-family="Inter, SF Pro Display, -apple-system, sans-serif" font-size="32" fill="#e3e3e3" text-anchor="middle" opacity="0.9">"The Last Interface"</text>
    
    <!-- Description -->
    <text x="0" y="220" font-family="Inter, SF Pro Display, -apple-system, sans-serif" font-size="20" fill="#b3b3b3" text-anchor="middle">The World's Most Advanced Media Player</text>
    
    <!-- Features -->
    <g transform="translate(-350, 280)">
      <text font-family="Inter, SF Pro Display, sans-serif" font-size="18" fill="#25c2a0">🦀 Rust</text>
      <text x="120" font-family="Inter, SF Pro Display, sans-serif" font-size="18" fill="#25c2a0">⚡ Fast</text>
      <text x="220" font-family="Inter, SF Pro Display, sans-serif" font-size="18" fill="#25c2a0">🔒 Secure</text>
      <text x="340" font-family="Inter, SF Pro Display, sans-serif" font-size="18" fill="#25c2a0">🌐 Cross-Platform</text>
      <text x="510" font-family="Inter, SF Pro Display, sans-serif" font-size="18" fill="#25c2a0">🔌 Extensible</text>
    </g>
  </g>
  
  <!-- URL -->
  <text x="640" y="600" font-family="monospace" font-size="16" fill="#666" text-anchor="middle">github.com/vantisCorp/Vantis-Media-Player</text>
  
  <!-- Decorative Elements -->
  <g opacity="0.2">
    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#socialGradient)" stroke-width="1"/>
    <circle cx="1180" cy="540" r="60" fill="none" stroke="url(#socialGradient)" stroke-width="1"/>
  </g>
</svg>