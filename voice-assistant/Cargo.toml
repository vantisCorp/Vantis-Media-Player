[package]
name = "vantis-voice-assistant"
version = "0.1.0"
edition = "2021"
description = "Voice assistant integration for Vantis Media Player (Alexa, Google Assistant, Siri)"
authors = ["Vantis Media Team"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
jsonwebtoken = "9.2"
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"