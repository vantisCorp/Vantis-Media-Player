[package]
name = "vantis-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "Plugin SDK for Vantis Media Player extensions"
license = "MIT"
authors = ["Vantis Media Team"]
repository = "https://github.com/vantisCorp/Vantis-Media-Player"
keywords = ["plugin", "sdk", "media", "player", "extension"]
categories = ["multimedia", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["sync", "rt", "time"] }
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
semver = { version = "1.0", features = ["serde"] }
libloading = "0.8"
dashmap = "5.5"
parking_lot = "0.12"

# [dependencies.vantis-plugin-macros]
# path = "../plugin-macros"
# optional = true
# NOTE: plugin-macros crate not yet implemented

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"

[features]
default = ["host", "plugin"]
host = []
plugin = []
# macros = ["vantis-plugin-macros"]  # Not yet implemented
dynamic-loading = []
sandbox = []

[package.metadata.docs.rs]
all-features = true