# Pre-commit hooks for Vantis Media Player

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key
      - id: fix-byte-order-marker

  # Gitleaks - Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  # Rust hooks
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: cargo-check
        args: ['--all-targets', '--all-features']
      - id: cargo-clippy
        args: ['--all-targets', '--all-features', '--', '-D', 'warnings']
      - id: cargo-fmt
        args: ['--', '--check']

  # Typos
  - repo: https://github.com/crate-ci/typos
    rev: v1.16.23
    hooks:
      - id: typos

  # Local hooks
  - repo: local
    hooks:
      - id: rust-tests
        name: Run Rust tests
        entry: cargo test --lib
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: rust-docs
        name: Check documentation
        entry: cargo doc --no-deps --all-features
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: commit-msg-signed
        name: Check commit message signature
        entry: bash -c 'grep -q "Signed-off-by" "$1" || echo "Warning: No Signed-off-by line"'
        language: system
        stages: [commit-msg]

default_language_version:
  python: python3

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [rust-tests, rust-docs]
  submodules: false