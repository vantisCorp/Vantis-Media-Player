# Cargo Deny Configuration
# Checks for unapproved licenses, advisories, and duplicate dependencies
# Compatible with cargo-deny 0.16+

[graph]
all-features = true

[advisories]
# A list of advisory IDs to ignore
ignore = [
    # ring 0.16.20 pulled in by libp2p 0.53 -> snow -> ring 0.16
    # This is a transitive dependency that cannot be updated without
    # a major libp2p version bump. The vulnerability (AES panic with
    # overflow checking) has low practical impact in our use case.
    # TODO: Remove when libp2p is updated to a version using ring >= 0.17
    { id = "RUSTSEC-2025-0009", reason = "transitive dep from libp2p, low impact" },
]

[licenses]
# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8

# Some crates don't have easily machine-readable licensing
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []