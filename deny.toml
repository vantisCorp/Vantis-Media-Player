# Cargo Deny Configuration
# Checks for unapproved licenses, advisories, and duplicate dependencies

[graph]
# Targets to check
all-features = true

[advisories]
# The lint level for security vulnerabilities
vulnerability = "deny"
# The lint level for crates that have been yanked from their source registry
yanked = "warn"
# A list of advisory IDs to ignore
ignore = [
    # ring 0.16.20 pulled in by libp2p 0.53 → snow → ring 0.16
    # This is a transitive dependency that cannot be updated without
    # a major libp2p version bump. The vulnerability (AES panic with
    # overflow checking) has low practical impact in our use case.
    # TODO: Remove when libp2p is updated to a version using ring >= 0.17
    { id = "RUSTSEC-2025-0009", reason = "transitive dep from libp2p, low impact" },
]

[licenses]
# The lint level for crates which do not have a detectable license
unlicensed = "deny"
# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
]
# Lint level used when the license cannot be classified
default = "deny"
# Confidence threshold for detecting licenses from license text
confidence-threshold = 0.8

# Some crates don't have easily machine-readable licensing, so we need
# to manually specify them
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
highlight = "all"

[sources]
# Lint level for what to happen when a crate from a crate registry that is
# not in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "warn"
# List of URLs for allowed crate registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of URLs for allowed Git repositories
allow-git = []