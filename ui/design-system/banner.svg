<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="vantisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1a0a10;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a0a10;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Crimson Glow -->
    <radialGradient id="crimsonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DC143C;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#DC143C;stop-opacity:0" />
    </radialGradient>
    
    <!-- Animated Pulse -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Noise Texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000"/>
  
  <!-- Gradient Layer -->
  <rect width="100%" height="100%" fill="url(#vantisGradient)"/>
  
  <!-- Crimson Glow Center -->
  <ellipse cx="600" cy="200" rx="400" ry="200" fill="url(#crimsonGlow)"/>
  
  <!-- Geometric Lines -->
  <g stroke="#DC143C" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>
  
  <!-- Geometric Shapes -->
  <g fill="none" stroke="#DC143C" stroke-width="2" filter="url(#glow)">
    <!-- Left Arrow -->
    <polygon points="50,200 100,150 100,250" fill="#DC143C" fill-opacity="0.5"/>
    
    <!-- Right Arrow -->
    <polygon points="1150,200 1100,150 1100,250" fill="#DC143C" fill-opacity="0.5"/>
    
    <!-- Center Diamond -->
    <polygon points="600,100 700,200 600,300 500,200" stroke-width="3"/>
    
    <!-- Corner Brackets -->
    <path d="M 20,20 L 20,80 M 20,20 L 80,20" stroke-width="3"/>
    <path d="M 1180,20 L 1180,80 M 1180,20 L 1120,20" stroke-width="3"/>
    <path d="M 20,380 L 20,320 M 20,380 L 80,380" stroke-width="3"/>
    <path d="M 1180,380 L 1180,320 M 1180,380 L 1120,380" stroke-width="3"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="180" text-anchor="middle" font-family="'Bebas Neue', Impact, sans-serif" font-size="72" fill="#FFFFFF" filter="url(#glow)">
    VANTIS
  </text>
  <text x="600" y="250" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24" fill="#DC143C" letter-spacing="0.3em">
    MEDIA PLAYER
  </text>
  <text x="600" y="310" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.7" letter-spacing="0.2em">
    THE LAST INTERFACE
  </text>
  
  <!-- Decorative Elements -->
  <g fill="#DC143C" fill-opacity="0.5">
    <circle cx="150" cy="200" r="4"/>
    <circle cx="1050" cy="200" r="4"/>
    <circle cx="600" cy="50" r="4"/>
    <circle cx="600" cy="350" r="4"/>
  </g>
</svg>