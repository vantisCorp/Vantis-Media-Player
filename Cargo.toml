[package]
name = "vantis-player"
version = "1.6.0"
edition = "2021"
description = "Advanced media player for VantisOS - The Omni-System Architecture"
authors = ["Vantis Team"]
license = "MIT"

[workspace]
members = [
    # Core modules
    "core",
    "video",
    "audio",
    "ui",
    "subtitles",
    "plugins",
    "plugin-sdk",
    "integrations",
    "ai",
    "ai-recommendations",
    "streaming",
    "cli",
    "marketplace",
    "devtools",
    "hwaccel",
    "monitoring",
    "cloud",
    "voice",
    "voice-assistant",
    "streaming-services",
    "collaboration",
    "social",
    "live-streaming",
    "video-editing",
    "video-filters",
    "screen-recording",
    "spatial-audio",

    # Advanced modules
    "advanced_audio",
    "advanced_video",
    "advanced_ui",
    "advanced_plugins",
    "advanced_testing",
    "advanced_docs",
    "advanced_build",
    "advanced_analytics",

    # Packages (new architecture)
    "packages/core",
]

[workspace.package]
version = "1.6.0"
edition = "2021"
rust-version = "1.75.0"
repository = "https://github.com/vantisCorp/Vantis-Media-Player"
homepage = "https://vantis.media"
documentation = "https://docs.vantis.media"
license = "MIT"
authors = ["Vantis Team"]

[workspace.dependencies]
# Core Dependencies
tokio = { version = "1.35", features = ["full"] }
wgpu = { version = "0.19", features = ["webgl"] }
iced = { version = "0.10", features = ["image", "canvas"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Media Processing
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
ffmpeg-next = "7.0"
image = "0.24"
rubato = "0.14"
dasp = { version = "0.11", features = ["all"] }
rustfft = "6.1"
realfft = "3.3"
aubio-rs = "0.2"
nalgebra = "0.32"
num-complex = "0.4"

# Async & Concurrency
futures = "0.3"
async-trait = "0.1"

# Network & Scraping
reqwest = { version = "0.11", features = ["json", "stream", "cookies"] }
scraper = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = { version = "0.14", features = ["full"] }
hyper-tls = "0.5"
rustls = "0.21"
webpki-roots = "0.25"

# WASM & Plugins
wasmtime = "15.0"

# Streaming protocols
# NOTE: hls, dash, rtsp crates don't exist on crates.io
# Streaming protocol support is implemented in the streaming/ crate
# using reqwest, hyper, and custom protocol handlers

# P2P
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "mdns", "kad"] }

# UI & Graphics
winit = "0.28"
raw-window-handle = "0.5"

# AI & ML
burn = { version = "0.20", features = ["train", "ndarray"] }
candle-core = "0.3"
ndarray = "0.15"
tch = "0.13"
imageproc = "0.23"
rayon = "1.8"
num-traits = "0.2"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Configuration
toml = "0.8"

# Utilities
bytes = "1.5"
byteorder = "1.5"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
dashmap = "5.5"
parking_lot = "0.12"
num_cpus = "1.16"
crossbeam = "0.8"
itertools = "0.12"
url = "2.5"

# Testing
criterion = "0.5"

# Security & Signing
ed25519-dalek = "2.0"
sha2 = "0.10"
base64 = "0.21"
hex = "0.4"
semver = "1.0"

[build-dependencies]
chrono = "0.4"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Workspace members - Legacy (will be replaced)
vantis-core = { path = "core" }
vantis-video = { path = "video" }
vantis-audio = { path = "audio" }
vantis-ui = { path = "ui" }
vantis-subtitles = { path = "subtitles" }
vantis-plugins = { path = "plugins" }
vantis-integrations = { path = "integrations" }
vantis-ai = { path = "ai" }
vantis-streaming = { path = "streaming" }
vantis-advanced-audio = { path = "advanced_audio" }
vantis-advanced-video = { path = "advanced_video" }
vantis-advanced-ui = { path = "advanced_ui" }
vantis-advanced-plugins = { path = "advanced_plugins" }
vantis-advanced-testing = { path = "advanced_testing" }
vantis-advanced-docs = { path = "advanced_docs" }
vantis-advanced-build = { path = "advanced_build" }
vantis-advanced-analytics = { path = "advanced_analytics" }
vantis-cli = { path = "cli" }
vantis-marketplace = { path = "marketplace" }
vantis-devtools = { path = "devtools" }
vantis-hwaccel = { path = "hwaccel" }

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
incremental = true

[profile.test]
inherits = "dev"
debug = true
opt-level = 2

[profile.bench]
inherits = "release"
debug = true
strip = false