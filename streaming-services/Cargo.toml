[package]
name = "vantis-streaming-services"
version = "0.1.0"
edition = "2021"
description = "Streaming services integration for Vantis Media Player (Netflix, Hulu, Disney+, etc.)"
authors = ["Vantis Team"]
license = "MIT"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
oauth2 = "4.4"
url = "2.5"
base64 = "0.21"
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "9.2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"