# Configuration for cargo-audit
# This file configures which security advisories to ignore during audits.

# Advisory IDs to ignore
# These are primarily transitive dependencies that we cannot directly update.
# The project should periodically review these and update when possible.
[advisories]
ignore = [
    # gix-features: SHA-1 collision attacks - transitive via git2
    "RUSTSEC-2025-0021",
    # gix-fs: Traversal outside working tree - transitive via git2
    "RUSTSEC-2024-0350",
    # idna: Punycode labels - transitive dependency
    "RUSTSEC-2024-0421",
    # protobuf: Crash due to uncontrolled recursion - transitive dependency
    "RUSTSEC-2024-0437",
    # ring: AES overflow panic - transitive dependency
    "RUSTSEC-2025-0009",
    # wasmtime: Various security issues - transitive dependency
    "RUSTSEC-2026-0020",
    "RUSTSEC-2024-0438",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2025-0118",
    "RUSTSEC-2025-0046",
    # Unmaintained crates - transitive dependencies
    "RUSTSEC-2025-0010",  # ring 0.16 is unmaintained
    "RUSTSEC-2025-0134",  # rustls-pemfile is unmaintained
    "RUSTSEC-2024-0436",  # paste is unmaintained
    "RUSTSEC-2021-0140",  # rusttype is unmaintained
    "RUSTSEC-2025-0141",  # bincode is unmaintained
    "RUSTSEC-2025-0058",  # custom_derive is unmaintained
    "RUSTSEC-2025-0057",  # fxhash is unmaintained
    "RUSTSEC-2024-0384",  # instant is unmaintained
    "RUSTSEC-2020-0168",  # mach is unmaintained
    "RUSTSEC-2025-0119",  # number_prefix is unmaintained
    # Unsound warnings
    "RUSTSEC-2026-0008",  # git2: Potential undefined behavior
    "RUSTSEC-2026-0002",  # lru: IterMut violates Stacked Borrows
    "RUSTSEC-2024-0442",  # wasmtime-jit-debug: Dump Undefined Memory
]