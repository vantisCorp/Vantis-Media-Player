[package]
name = "vantis-collaboration"
version = "0.1.0"
edition = "2021"
description = "Real-time collaborative viewing for Vantis Media Player"
authors = ["Vantis Team"]
license = "MIT"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
dashmap = "5.5"
parking_lot = "0.12"
rand = "0.8"
base64 = "0.21"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"