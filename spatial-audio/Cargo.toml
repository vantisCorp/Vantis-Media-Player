[package]
name = "vantis-spatial-audio"
version = "0.1.0"
edition = "2021"
description = "Spatial audio processing for Vantis Media Player"
authors = ["Vantis Media Team"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
num-complex = "0.4"
rustfft = "0.13"
ndarray = "0.15"
nalgebra = "0.32"
rubato = "0.14"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "spatial_benchmark"
harness = false