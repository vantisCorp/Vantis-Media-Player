name: Build System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Native Builds
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev \
            libavutil-dev libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev || \
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev libasound2-dev \
            libavutil-dev libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev || \
          sudo apt-get install -y pkg-config libgtk-3-dev librsvg2-dev libasound2-dev \
            libavutil-dev libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev
      
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      
      - name: Build
        run: cargo build --release --verbose
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vantis-player-linux-x86_64
          path: target/release/vantis-player
          if-no-files-found: ignore

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      
      - name: Build
        run: cargo build --release --verbose
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vantis-player-macos
          path: target/release/vantis-player
          if-no-files-found: ignore

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      
      - name: Build
        run: cargo build --release --verbose
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vantis-player-windows
          path: target/release/vantis-player.exe
          if-no-files-found: ignore

  # Cross-Compilation Builds
  build-linux-cross:
    name: Build (Linux Cross)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: ${{ matrix.target }}
      
      - name: Install Cross
        run: cargo install cross
      
      - name: Build
        run: cross build --release --target=${{ matrix.target }}
        continue-on-error: true
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vantis-player-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vantis-player
          if-no-files-found: ignore

  # WebAssembly Build
  build-wasm:
    name: Build (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      
      - name: Install wasm-pack
        run: cargo install wasm-pack
      
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build WASM
        run: |
          if [ -f "Cargo.toml" ]; then
            wasm-pack build --target web --out-dir target/dist/wasm || echo "WASM build not configured"
          fi
        continue-on-error: true
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vantis-player-wasm
          path: target/dist/wasm
          if-no-files-found: ignore