name: Build System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Native Builds
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libpostproc-dev \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: ./buildsystem/build.sh native
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantis-player-linux-x86_64
          path: target/dist/*.tar.gz

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          brew install ffmpeg pkg-config cmake nasm openssl@3
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: ./buildsystem/build.sh native
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantis-player-macos
          path: target/dist/*.dmg

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        shell: pwsh
        run: |
          choco install -y pkgconfiglite cmake nasm
          # Install vcpkg and FFmpeg
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install ffmpeg:x64-windows openssl:x64-windows
        env:
          VCPKG_ROOT: C:\vcpkg
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: ./buildsystem/build.sh native
        env:
          VCPKG_ROOT: C:\vcpkg
          PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows\lib\pkgconfig
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantis-player-windows
          path: target/dist/*.zip

  # Cross-Compilation Builds
  build-linux-cross:
    name: Build (Linux Cross)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install Cross
        run: cargo install cross
      
      - name: Build
        run: cross build --release --target=${{ matrix.target }}
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantis-player-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vantis-player

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: ./buildsystem/build.sh android-all
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantis-player-android-${{ matrix.arch }}
          path: target/dist/android-${{ matrix.arch }}/*

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install system dependencies
        run: |
          brew install ffmpeg pkg-config cmake nasm openssl@3
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: ./buildsystem/build.sh ios-all
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantis-player-ios-${{ matrix.target }}
          path: target/dist/${{ matrix.target }}/*

  build-wasm:
    name: Build (WebAssembly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install wasm-pack
        run: cargo install wasm-pack
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: ./buildsystem/build.sh wasm
      
      - name: Optimize WASM
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'
          actions-cache-folder: 'emsdk-cache'
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantis-player-wasm
          path: target/dist/wasm/*

  # FreeBSD Cross-Compilation
  build-freebsd:
    name: Build (FreeBSD)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        target: [x86_64-unknown-freebsd]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cross
        run: cargo install cross
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: freebsd-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cross build --release --target=${{ matrix.target }}
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vantis-player-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vantis-player

  # Reproducible Build Verification
  verify-reproducible:
    name: Verify Reproducible Build
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Verify Reproducible Build
        run: ./scripts/verify-reproducible.sh
        continue-on-error: true
      
      - name: Upload Verification Report
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-report
          path: target/reproducible-test/

  # Build Performance Monitoring
  build-performance:
    name: Build Performance Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc jq
      
      - name: Measure Build Performance
        run: ./scripts/build-performance.sh release
        continue-on-error: true
      
      - name: Upload Performance Report
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: target/performance/