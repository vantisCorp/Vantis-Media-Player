name: Build Installers

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Create tarball
        run: |
          mkdir -p installer/vantis-player
          cp target/x86_64-unknown-linux-gnu/release/vantis-player installer/vantis-player/ || true
          cp README.md installer/vantis-player/ || true
          cp LICENSE installer/vantis-player/ || true
          cp CHANGELOG.md installer/vantis-player/ || true
          cd installer && tar -czf ../vantis-player-linux-x64.tar.gz vantis-player

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: vantis-player-linux-x64
          path: vantis-player-linux-x64.tar.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vantis-player-linux-x64.tar.gz
          draft: false
          prerelease: false
