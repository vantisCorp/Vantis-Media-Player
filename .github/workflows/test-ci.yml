name: Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo hello
        run: echo "Hello World"
      
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: List files
        run: ls -la
      
      - name: Print Rust version
        run: rustc --version