name: Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rust != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run Unit Tests
        run: cargo test --all --verbose
        continue-on-error: true

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: integration-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run Integration Tests
        run: cargo test --test '*' --verbose

  # Fuzz Testing - Based on VideoLAN's fuzz testing
  fuzz-testing:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Install Cargo Fuzz
        run: cargo install cargo-fuzz
      
      - name: Run Fuzz Tests
        run: |
          cargo fuzz build || true
          cargo fuzz run fuzz_target_1 -- -max_total_time=300 || true

  # Benchmarks
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: benchmark-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run Benchmarks
        run: cargo bench --all || true

  # Code Coverage
  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin
      
      - name: Generate Coverage
        run: cargo tarpaulin --out xml --all || true
      
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./cobertura.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Clippy Linting
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Rustfmt Check
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check Formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

  # Conformance Tests - Based on VideoLAN's approach
  conformance-tests:
    name: Conformance Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Run Conformance Tests
        run: |
          cargo test --test conformance --verbose || true
          # Test against reference media files
          cargo test --test media_conformance --verbose || true

  # Memory Safety Tests
  memory-safety:
    name: Memory Safety (Valgrind, ASan, UBSan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            cmake \
            nasm \
            valgrind
      
      - name: Run with AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" \
          cargo test --all --release --target x86_64-unknown-linux-gnu || true
      
      - name: Run with UndefinedBehaviorSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=undefined" \
          cargo test --all --release --target x86_64-unknown-linux-gnu || true

  # Thread Safety Tests
  thread-safety:
    name: Thread Safety (ThreadSanitizer)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            cmake \
            nasm
      
      - name: Run with ThreadSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=thread" \
          cargo test --all --release --target x86_64-unknown-linux-gnu || true