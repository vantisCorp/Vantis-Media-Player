name: Bug Report
description: File a bug report to help us improve
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before submitting a bug report
        
        Thank you for helping us improve Vantis Media Player! Please fill out this form to help us reproduce and fix the issue.
        
        ### Checklist
        - [ ] I've searched for existing issues
        - [ ] I've read the documentation
        - [ ] I'm using the latest version
        
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
      
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
      
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe the expected behavior
    validations:
      required: true
      
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe the actual behavior
    validations:
      required: true
      
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Environment information
      value: |
        - OS: [e.g., Windows 11, macOS 14, Ubuntu 22.04]
        - Vantis Media Player Version: [e.g., 2.0.0]
        - Browser/Platform: [if applicable]
        - Installation Method: [e.g., Flatpak, AppImage, Docker, Source]
      render: shell
    validations:
      required: true
      
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs (copy-paste or attach files)
      placeholder: Paste logs here (use code blocks)
      render: shell
      
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Screenshots or screen recordings
      placeholder: Drag and drop screenshots here
      
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Additional information